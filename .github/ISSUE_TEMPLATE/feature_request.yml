name: Feature request
description: Suggest an improvement to ACS.
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, email addresses, or private paths. Use synthetic
        examples and sanitized text.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the task you want to accomplish and the current limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like ACS to provide.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds you have considered.
