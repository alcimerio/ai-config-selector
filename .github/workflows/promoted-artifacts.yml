name: Promoted artifact validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: promoted-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  # Development identity only. It is not a published v0.5.0 release.
  ACS_CANDIDATE_VERSION: v0.5.0

jobs:
  candidate:
    name: Build candidate artifact set
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify candidate artifact set
        run: scripts/release-candidate.sh "$ACS_CANDIDATE_VERSION"

      - name: Fetch and verify locked native authentication targets
        run: scripts/fetch-codex-test-targets.sh scripts/codex-test-targets.lock dist/codex-test-targets

      - name: Upload immutable candidate artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acs-candidate-${{ github.sha }}
          path: dist/release-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload immutable native authentication targets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-test-targets-${{ github.sha }}
          path: dist/codex-test-targets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    name: Native ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
            os: darwin
            arch: arm64
            sandbox_backend: available
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out validation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download immutable candidate artifact set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acs-candidate-${{ github.sha }}
          path: dist/release-candidate

      - name: Download immutable native authentication targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-test-targets-${{ github.sha }}
          path: dist/codex-test-targets

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Promoted candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify host and install supplied candidate
        shell: bash
        run: |
          install_root="${RUNNER_TEMP}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$install_root"
          scripts/validate-promoted-artifact.sh \
            "$ACS_CANDIDATE_VERSION" \
            "${{ matrix.os }}" \
            "${{ matrix.arch }}" \
            dist/release-candidate \
            "$install_root/bin"

      - name: Install verified matching authentication target
        shell: bash
        run: |
          target_root="${RUNNER_TEMP}/codex-target-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$target_root/bin"
          scripts/install-codex-test-target.sh \
            scripts/codex-test-targets.lock \
            dist/codex-test-targets \
            "${{ matrix.arch }}" \
            "$target_root/bin/codex"

      - name: Install checksum locked Devin rules target
        shell: bash
        run: |
          target_root="${RUNNER_TEMP}/devin-target-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$target_root/bin"
          scripts/install-devin-test-target.sh \
            scripts/devin-test-targets.lock \
            "$target_root" \
            "$target_root/bin/devin"
          echo "ACS_TEST_DEVIN_BINARY=$target_root/bin/devin" >> "$GITHUB_ENV"
          echo "ACS_TEST_DEVIN_ARCHIVE=$target_root/devin-3000.10.21-darwin-arm64.tar.gz" >> "$GITHUB_ENV"

      - name: Run shared native release candidate gates
        id: baseline
        run: |
          scripts/run-native-candidate-gates.sh \
            "$ACS_CANDIDATE_VERSION" \
            "${RUNNER_TEMP}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}/bin/acs" \
            "${RUNNER_TEMP}/codex-target-${{ matrix.os }}-${{ matrix.arch }}/bin/codex" \
            "${GITHUB_WORKSPACE}/dist/codex-test-targets/codex_0.149.1_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" \
            "${RUNNER_TEMP}/acs-native-auth-recovery" \
            "${{ matrix.sandbox_backend }}"

      - name: Run opt-in installed extension discovery assessment
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          ACS_RUN_NATIVE_EXTENSION_DISCOVERY: "1"
          ACS_PROMOTED_VERSION: ${{ env.ACS_CANDIDATE_VERSION }}
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
          ACS_PROMOTED_SANDBOX_BACKEND: ${{ matrix.sandbox_backend }}
          ACS_TEST_CODEX_BINARY: ${{ runner.temp }}/codex-target-${{ matrix.os }}-${{ matrix.arch }}/bin/codex
          ACS_TEST_CODEX_ARCHIVE: ${{ github.workspace }}/dist/codex-test-targets/codex_0.149.1_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          ACS_TEST_DEVIN_BINARY: ${{ runner.temp }}/devin-target-${{ matrix.os }}-${{ matrix.arch }}/bin/devin
          ACS_TEST_DEVIN_ARCHIVE: ${{ runner.temp }}/devin-target-${{ matrix.os }}-${{ matrix.arch }}/devin-3000.10.21-darwin-arm64.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          test_name='TestNativeInstalledExtensionDiscovery'
          listed="$(go test ./acceptance -list "^${test_name}$")"
          if ! grep -Fxq "${test_name}" <<<"${listed}"; then
            echo "required extension discovery test was not discovered"
            exit 1
          fi
          go test ./acceptance -run "^${test_name}$" -count=1 -v -timeout=2m

      - name: Run opt-in installed Codex agent discovery assessment
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          ACS_RUN_NATIVE_AGENT_DISCOVERY: "1"
          ACS_RUN_NATIVE_AUTH_GATE: "1"
          ACS_PROMOTED_VERSION: ${{ env.ACS_CANDIDATE_VERSION }}
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
          ACS_PROMOTED_SANDBOX_BACKEND: ${{ matrix.sandbox_backend }}
          ACS_NATIVE_AUTH_RECOVERY_ROOT: ${{ runner.temp }}/acs-native-auth-recovery
          ACS_TEST_CODEX_BINARY: ${{ runner.temp }}/codex-target-${{ matrix.os }}-${{ matrix.arch }}/bin/codex
          ACS_TEST_CODEX_ARCHIVE: ${{ github.workspace }}/dist/codex-test-targets/codex_0.149.1_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          primary_status=0
          finish() {
            primary_status=$?
            trap - EXIT HUP INT TERM
            set +e
            ACS_RUN_NATIVE_AUTH_RECOVERY=1 \
              ACS_NATIVE_AUTH_RECOVERY_ROOT="$ACS_NATIVE_AUTH_RECOVERY_ROOT" \
              go test ./internal/codexauthresource -run '^TestNativeKeychainRecoveryEntrypoint$' -count=1 -timeout=2m
            recovery_status=$?
            if [ "$primary_status" -ne 0 ]; then exit "$primary_status"; fi
            exit "$recovery_status"
          }
          recovery_name='TestNativeKeychainRecoveryEntrypoint'
          recovery_listed="$(go test ./internal/codexauthresource -list "^${recovery_name}$")"
          if ! grep -Fxq "${recovery_name}" <<<"${recovery_listed}"; then
            echo "required Codex keychain recovery test was not discovered"
            exit 1
          fi
          trap finish EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          test_name='TestNativeInstalledCustomCodexAgentDiscovery'
          listed="$(go test ./internal/codexauthresource -list "^${test_name}$")"
          if ! grep -Fxq "${test_name}" <<<"${listed}"; then
            echo "required Codex agent discovery test was not discovered"
            exit 1
          fi
          go test ./internal/codexauthresource -run "^${test_name}$" -count=1 -v -timeout=2m

      - name: Run opt-in installed Devin agent discovery assessment
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          ACS_RUN_NATIVE_AGENT_DISCOVERY: "1"
          ACS_PROMOTED_VERSION: ${{ env.ACS_CANDIDATE_VERSION }}
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
          ACS_PROMOTED_SANDBOX_BACKEND: ${{ matrix.sandbox_backend }}
          ACS_TEST_DEVIN_BINARY: ${{ runner.temp }}/devin-target-${{ matrix.os }}-${{ matrix.arch }}/bin/devin
          ACS_TEST_DEVIN_ARCHIVE: ${{ runner.temp }}/devin-target-${{ matrix.os }}-${{ matrix.arch }}/devin-3000.10.21-darwin-arm64.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          test_name='TestPromotedArtifactNativeCustomDevinAgentDiscovery'
          listed="$(go test ./acceptance -list "^${test_name}$")"
          if ! grep -Fxq "${test_name}" <<<"${listed}"; then
            echo "required Devin agent discovery test was not discovered"
            exit 1
          fi
          go test ./acceptance -run "^${test_name}$" -count=1 -v -timeout=2m

      - name: Run opt-in Devin SessionStart hook assessment
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          ACS_RUN_NATIVE_DEVIN_HOOK_ASSESSMENT: "1"
          ACS_PROMOTED_VERSION: ${{ env.ACS_CANDIDATE_VERSION }}
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
          ACS_PROMOTED_SANDBOX_BACKEND: ${{ matrix.sandbox_backend }}
          ACS_TEST_DEVIN_BINARY: ${{ runner.temp }}/devin-target-${{ matrix.os }}-${{ matrix.arch }}/bin/devin
          ACS_TEST_DEVIN_ARCHIVE: ${{ runner.temp }}/devin-target-${{ matrix.os }}-${{ matrix.arch }}/devin-3000.10.21-darwin-arm64.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          test_name='TestPromotedArtifactNativeDevinSessionStartHook'
          listed="$(go test ./acceptance -list "^${test_name}$")"
          if ! grep -Fxq "${test_name}" <<<"${listed}"; then
            echo "required hook assessment test was not discovered"
            exit 1
          fi
          go test ./acceptance -run "^${test_name}$" -count=3 -v -timeout=12m

      - name: Record sanitized native candidate observation
        shell: bash
        run: |
          {
            printf '%s\n' '## Native candidate gate'
            printf '%s\n' ''
            printf '%s\n' "- Target: \`${{ matrix.target }}\` on its required native runner."
            printf '%s\n' "- Backend observation: required native backend is \`${{ matrix.sandbox_backend }}\`."
            printf '%s\n' '- Candidate observation: the installed black-box containment and lifecycle suite passed.'
            printf '%s\n' '- Authentication observation: the official checksum-locked Codex CLI passed with synthetic authentication and a local simulated API, alongside the isolated Keychain, fresh-process recovery, credential-free contained status, and direct target lifecycle gates.'
            printf '%s\n' '- Automation boundary: no maintainer credentials, real account login, hosted inference, or quota are used; real daily-use observation remains pending.'
            printf '%s\n' '- Interactive evidence boundary: direct raw-target containment and the installed-ACS trampoline-assisted loopback model turn are distinct observations; no fake target or production fixture hook is used.'
            printf '%s\n' '- Authentication boundary: production queries prohibit authentication UI, deterministic tests cover locked or unavailable mapping, and live locked-Keychain and ACL probes remain supplemental.'
            printf '%s\n' '- Generic command observation: literal argv, sanitized environment, pipes, standard output descriptors, workspace modes, unrelated-path denial, and Session settlement passed through the installed candidate.'
            printf '%s\n' '- Compatibility rule: this candidate supports macOS 26 on Apple Silicon and uses the verified system Seatbelt backend.'
            printf '%s\n' '- The candidate itself is never rebuilt in this job.'
            printf '%s\n' '- No credentials, account data, target output, Session contents, private paths, generated policy, environment values, or control characters are recorded.'
          } >>"$GITHUB_STEP_SUMMARY"
