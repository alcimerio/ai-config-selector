name: Promoted artifact validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: promoted-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  ACS_CANDIDATE_VERSION: v0.4.0

jobs:
  candidate:
    name: Build candidate artifact set
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify candidate artifact set
        run: scripts/release-candidate.sh "$ACS_CANDIDATE_VERSION"

      - name: Fetch and verify locked native authentication targets
        run: scripts/fetch-codex-test-targets.sh scripts/codex-test-targets.lock dist/codex-test-targets

      - name: Upload immutable candidate artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acs-candidate-${{ github.sha }}
          path: dist/release-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload immutable native authentication targets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-test-targets-${{ github.sha }}
          path: dist/codex-test-targets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    name: Native ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
            os: darwin
            arch: arm64
            sandbox_backend: available
          - target: darwin/amd64
            runner: macos-26-intel
            os: darwin
            arch: amd64
            sandbox_backend: available
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out validation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download immutable candidate artifact set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acs-candidate-${{ github.sha }}
          path: dist/release-candidate

      - name: Download immutable native authentication targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-test-targets-${{ github.sha }}
          path: dist/codex-test-targets

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Promoted candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify host and install supplied candidate
        shell: bash
        run: |
          install_root="${RUNNER_TEMP}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$install_root"
          scripts/validate-promoted-artifact.sh \
            "$ACS_CANDIDATE_VERSION" \
            "${{ matrix.os }}" \
            "${{ matrix.arch }}" \
            dist/release-candidate \
            "$install_root/bin"

      - name: Install verified matching authentication target
        shell: bash
        run: |
          target_root="${RUNNER_TEMP}/codex-target-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$target_root/bin"
          scripts/install-codex-test-target.sh \
            scripts/codex-test-targets.lock \
            dist/codex-test-targets \
            "${{ matrix.arch }}" \
            "$target_root/bin/codex"

      - name: Run native application, Adapter, installer, and PTY regressions
        run: go test ./...

      - name: Run supported native race tests
        run: go test -race ./...

      - name: Run credential-free native authentication evidence
        env:
          ACS_RUN_NATIVE_AUTH_GATE: "1"
          ACS_TEST_CODEX_BINARY: ${{ runner.temp }}/codex-target-${{ matrix.os }}-${{ matrix.arch }}/bin/codex
        run: go test ./internal/codexauth -run 'TestNativeKeychainCredentialFreeContract|TestNativeInstalledTargetContainedStatusWithoutCredentials' -count=1

      - name: Exercise installed candidate as a black box
        env:
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
          ACS_PROMOTED_SANDBOX_BACKEND: ${{ matrix.sandbox_backend }}
        run: ACS_PROMOTED_VERSION="$ACS_CANDIDATE_VERSION" go test ./acceptance -count=1

      - name: Record sanitized native candidate observation
        shell: bash
        run: |
          {
            printf '%s\n' '## Native candidate gate'
            printf '%s\n' ''
            printf '%s\n' "- Target: \`${{ matrix.target }}\` on its required native runner."
            printf '%s\n' "- Backend observation: required native backend is \`${{ matrix.sandbox_backend }}\`."
            printf '%s\n' '- Candidate observation: the installed black-box containment and lifecycle suite passed.'
            printf '%s\n' '- Authentication observation: the checksum-locked native target, isolated Keychain contract, and credential-free contained status lifecycle passed.'
            printf '%s\n' '- Authentication boundary: production queries prohibit authentication UI, deterministic tests cover locked or unavailable mapping, and live locked-Keychain and ACL probes remain supplemental.'
            printf '%s\n' '- Compatibility rule: v0.4.0 release artifacts are macOS-only and use the verified system Seatbelt backend.'
            printf '%s\n' '- The candidate itself is never rebuilt in this job.'
            printf '%s\n' '- No credentials, account data, target output, Session contents, private paths, generated policy, environment values, or control characters are recorded.'
          } >>"$GITHUB_STEP_SUMMARY"
