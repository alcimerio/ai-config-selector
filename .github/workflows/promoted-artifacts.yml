name: Promoted artifact validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: promoted-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  ACS_CANDIDATE_VERSION: v0.2.0

jobs:
  candidate:
    name: Build candidate artifact set
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify candidate artifact set
        run: scripts/release-candidate.sh "$ACS_CANDIDATE_VERSION"

      - name: Upload immutable candidate artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acs-candidate-${{ github.sha }}
          path: dist/release-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    name: Native ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
            os: darwin
            arch: arm64
            sandbox_backend: unavailable
          - target: darwin/amd64
            runner: macos-26-intel
            os: darwin
            arch: amd64
            sandbox_backend: unavailable
          - target: linux/amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            sandbox_backend: available
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            sandbox_backend: available
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out validation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Ubuntu Bubblewrap
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor apparmor-utils bubblewrap
          profile_source="$(mktemp)"
          verify_stdout="$(mktemp)"
          verify_stderr="$(mktemp)"
          trap 'rm -f "$profile_source" "$verify_stdout" "$verify_stderr"' EXIT
          curl --fail --location --silent --show-error --output "$profile_source" \
            https://gitlab.com/apparmor/apparmor/-/raw/v4.0.3/profiles/apparmor/profiles/extras/bwrap-userns-restrict
          echo 'a964037f6cf0df1099f14226b037eaedde6237c86e715188e93eb460b30be859  '"$profile_source" | sha256sum --check --status
          sudo install --owner=root --group=root --mode=0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/sbin/apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/sbin/aa-status --enabled
          [[ -f /usr/bin/bwrap && ! -L /usr/bin/bwrap && -x /usr/bin/bwrap ]]
          [[ "$(stat --format='%u:%a' /usr/bin/bwrap)" == "0:755" ]]
          [[ "$(env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg-query --search /usr/bin/bwrap)" == "bubblewrap: /usr/bin/bwrap" ]]
          package_record="$(env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg-query --show --showformat='${db:Status-Abbrev}\n${binary:Package}\n${source:Package}\n${Architecture}\n' bubblewrap)"
          [[ "$package_record" == $'ii \nbubblewrap\nbubblewrap\n'"${{ matrix.arch }}" ]]
          env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg --verify --verify-format=rpm bubblewrap >"$verify_stdout" 2>"$verify_stderr"
          [[ ! -s "$verify_stdout" && ! -s "$verify_stderr" ]]
          /usr/bin/bwrap \
            --unshare-user --unshare-ipc --unshare-pid --unshare-uts --unshare-cgroup \
            --die-with-parent --clearenv --proc /proc --dev /dev \
            --dir /tmp \
            --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --ro-bind /usr /usr --remount-ro / \
            --setenv PATH /usr/bin:/bin --chdir /tmp -- /usr/bin/true

      - name: Download immutable candidate artifact set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acs-candidate-${{ github.sha }}
          path: dist/release-candidate

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Promoted candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify host and install supplied candidate
        shell: bash
        run: |
          install_root="${RUNNER_TEMP}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$install_root"
          scripts/validate-promoted-artifact.sh \
            "$ACS_CANDIDATE_VERSION" \
            "${{ matrix.os }}" \
            "${{ matrix.arch }}" \
            dist/release-candidate \
            "$install_root/bin"

      - name: Run native application, Adapter, installer, and PTY regressions
        run: go test ./...

      - name: Run supported native race tests
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            # cancelreader's Linux shutdown races with its reader when an
            # abrupt runtime-error or recovered-panic PTY subprocess is
            # race-instrumented. The preceding native regression step still
            # exercises both restoration cases.
            go test -race ./... -skip '^TestProfileBuilderPTYRestoresTerminal/(runtime_error|recovered_panic)$'
          else
            go test -race ./...
          fi

      - name: Exercise installed candidate as a black box
        env:
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-promoted-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
          ACS_PROMOTED_SANDBOX_BACKEND: ${{ matrix.sandbox_backend }}
        run: ACS_PROMOTED_VERSION="$ACS_CANDIDATE_VERSION" go test ./acceptance -count=1
