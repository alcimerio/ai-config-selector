name: Immutable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build gated candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-commit: ${{ steps.identity.outputs.source_commit }}
      tag-object: ${{ steps.identity.outputs.tag_object }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate annotated tag identity and release notes
        id: identity
        shell: bash
        run: |
          mapfile -t identity < <(scripts/release-tag-identity.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/authenticated-evidence.json")
          if [[ "${#identity[@]}" -ne 4 ]]; then
            echo "Release tag identity output is incomplete."
            exit 1
          fi
          echo "source_commit=${identity[0]}" >>"$GITHUB_OUTPUT"
          echo "tag_object=${identity[1]}" >>"$GITHUB_OUTPUT"
          echo "earliest_completion=${identity[2]}" >>"$GITHUB_OUTPUT"
          echo "latest_completion=${identity[3]}" >>"$GITHUB_OUTPUT"

      - name: Build the candidate exactly once
        run: scripts/release-candidate.sh "$GITHUB_REF_NAME"

      - name: Bind authenticated evidence to the candidate
        run: |
          go run ./tools/releasegate \
            --evidence "$RUNNER_TEMP/authenticated-evidence.json" \
            --candidate dist/release-candidate \
            --version "$GITHUB_REF_NAME" \
            --source-commit "${{ steps.identity.outputs.source_commit }}" \
            --earliest-completion "${{ steps.identity.outputs.earliest_completion }}" \
            --latest-completion "${{ steps.identity.outputs.latest_completion }}"

      - name: Upload the exact candidate artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    name: Native ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
            os: darwin
            arch: arm64
          - target: darwin/amd64
            runner: macos-26-intel
            os: darwin
            arch: amd64
          - target: linux/amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download the exact candidate artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-candidate

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Release candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify host and install supplied candidate
        shell: bash
        run: |
          install_root="${RUNNER_TEMP}/acs-release-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$install_root"
          scripts/validate-promoted-artifact.sh \
            "$GITHUB_REF_NAME" \
            "${{ matrix.os }}" \
            "${{ matrix.arch }}" \
            dist/release-candidate \
            "$install_root/bin"

      - name: Run native regressions
        run: go test ./...

      - name: Run supported native race tests
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            # cancelreader's Linux shutdown races with its reader when an
            # abrupt runtime-error or recovered-panic PTY subprocess is
            # race-instrumented. The preceding native regression step still
            # exercises both restoration cases.
            go test -race ./... -skip '^TestProfileBuilderPTYRestoresTerminal/(runtime_error|recovered_panic)$'
          else
            go test -race ./...
          fi

      - name: Exercise installed candidate as a black box
        env:
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-release-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
        run: ACS_PROMOTED_VERSION="$GITHUB_REF_NAME" go test ./acceptance -count=1

  attest:
    name: Attest exact release bytes
    needs:
      - candidate
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download native-validated candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-candidate

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Release candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify candidate identity before attestation
        run: go run ./tools/releaseverify --dist dist/release-candidate --version "$GITHUB_REF_NAME"

      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release-candidate/*.tar.gz
            dist/release-candidate/SHA256SUMS

  publish:
    name: Stage and publish immutable Release
    needs:
      - candidate
      - native
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download attested candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-candidate

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Release candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify candidate identity before publication
        run: go run ./tools/releaseverify --dist dist/release-candidate --version "$GITHUB_REF_NAME"

      - name: Create the isolated policy-verification token
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ACS_RELEASE_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACS_RELEASE_POLICY_APP_PRIVATE_KEY }}
          # GitHub omits ruleset bypass actors without Administration(write).
          permission-administration: write

      - name: Create the isolated Release-publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ACS_RELEASE_PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACS_RELEASE_PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Stage exact assets and publish once
        env:
          ACS_RELEASE_TAG_RULESET_ID: ${{ vars.ACS_RELEASE_TAG_RULESET_ID }}
          ACS_RELEASE_TAG_CREATION_RULESET_ID: ${{ vars.ACS_RELEASE_TAG_CREATION_RULESET_ID }}
          ACS_RELEASE_TAG_CREATOR_ID: ${{ vars.ACS_RELEASE_TAG_CREATOR_ID }}
          ACS_RELEASE_ACTOR_ID: ${{ github.actor_id }}
          ACS_RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          scripts/publish-release.sh \
            "$GITHUB_REF_NAME" \
            "${{ needs.candidate.outputs.source-commit }}" \
            "${{ needs.candidate.outputs.tag-object }}" \
            dist/release-candidate \
            "docs/releases/$GITHUB_REF_NAME.md"
