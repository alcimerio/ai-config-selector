name: Immutable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build gated candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-commit: ${{ steps.identity.outputs.source_commit }}
      tag-object: ${{ steps.identity.outputs.tag_object }}
      artifact-name: ${{ steps.artifact-name.outputs.name }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate annotated tag identity and release notes
        id: identity
        shell: bash
        run: |
          mapfile -t identity < <(scripts/release-tag-identity.sh "$GITHUB_REF_NAME")
          if [[ "${#identity[@]}" -ne 2 ]]; then
            echo "Release tag identity output is incomplete."
            exit 1
          fi
          echo "source_commit=${identity[0]}" >>"$GITHUB_OUTPUT"
          echo "tag_object=${identity[1]}" >>"$GITHUB_OUTPUT"

      - name: Build the candidate exactly once
        run: scripts/release-candidate.sh "$GITHUB_REF_NAME"

      - name: Name the exact candidate artifact set
        id: artifact-name
        shell: bash
        run: echo "name=release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"

      - name: Upload the exact candidate artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: dist/release-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    name: Native ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
            os: darwin
            arch: arm64
            sandbox_backend: available
          - target: darwin/amd64
            runner: macos-26-intel
            os: darwin
            arch: amd64
            sandbox_backend: available
          - target: linux/amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            sandbox_backend: available
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            sandbox_backend: available
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Ubuntu Bubblewrap
        if: matrix.os == 'linux'
        shell: bash
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          if ! timeout 60s sudo apt-get "${apt_options[@]}" update; then
            case "$(/usr/bin/dpkg --print-architecture)" in
              amd64) ubuntu_archive='https://archive.ubuntu.com/ubuntu/' ;;
              arm64) ubuntu_archive='https://ports.ubuntu.com/ubuntu-ports/' ;;
              *) echo 'Unsupported Ubuntu package architecture' >&2; exit 1 ;;
            esac
            printf '%s\n' "$ubuntu_archive" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            timeout 60s sudo apt-get "${apt_options[@]}" update
          fi
          timeout 60s sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends apparmor apparmor-utils bubblewrap
          profile_source="$(mktemp)"
          verify_stdout="$(mktemp)"
          verify_stderr="$(mktemp)"
          trap 'rm -f "$profile_source" "$verify_stdout" "$verify_stderr"' EXIT
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --output "$profile_source" \
            https://gitlab.com/apparmor/apparmor/-/raw/v4.0.3/profiles/apparmor/profiles/extras/bwrap-userns-restrict
          echo 'a964037f6cf0df1099f14226b037eaedde6237c86e715188e93eb460b30be859  '"$profile_source" | sha256sum --check --status
          sudo install --owner=root --group=root --mode=0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/sbin/apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/sbin/aa-status --enabled
          [[ -f /usr/bin/bwrap && ! -L /usr/bin/bwrap && -x /usr/bin/bwrap ]]
          [[ "$(stat --format='%u:%a' /usr/bin/bwrap)" == "0:755" ]]
          [[ "$(env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg-query --search /usr/bin/bwrap)" == "bubblewrap: /usr/bin/bwrap" ]]
          package_record="$(env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg-query --show --showformat='${db:Status-Abbrev}\n${binary:Package}\n${source:Package}\n${Architecture}\n' bubblewrap)"
          [[ "$package_record" == $'ii \nbubblewrap\nbubblewrap\n'"${{ matrix.arch }}" ]]
          env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg --verify --verify-format=rpm bubblewrap >"$verify_stdout" 2>"$verify_stderr"
          [[ ! -s "$verify_stdout" && ! -s "$verify_stderr" ]]
          /usr/bin/bwrap \
            --unshare-user --unshare-ipc --unshare-pid --unshare-uts --unshare-cgroup \
            --die-with-parent --clearenv --proc /proc --dev /dev \
            --dir /tmp \
            --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --ro-bind /usr /usr --remount-ro / \
            --setenv PATH /usr/bin:/bin --chdir /tmp -- /usr/bin/true

      - name: Download immutable candidate artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Release candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify host and install supplied candidate
        shell: bash
        run: |
          install_root="${RUNNER_TEMP}/acs-release-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$install_root"
          scripts/validate-promoted-artifact.sh \
            "$GITHUB_REF_NAME" \
            "${{ matrix.os }}" \
            "${{ matrix.arch }}" \
            dist/release-candidate \
            "$install_root/bin"

      - name: Run native regressions
        run: go test ./...

      - name: Run supported native race tests
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            # cancelreader's Linux shutdown races with its reader when an
            # abrupt runtime-error or recovered-panic PTY subprocess is
            # race-instrumented. The preceding native regression step still
            # exercises both restoration cases.
            go test -race ./... -skip '^TestProfileBuilderPTYRestoresTerminal/(runtime_error|recovered_panic)$'
          else
            go test -race ./...
          fi

      - name: Exercise installed candidate as a black box
        env:
          ACS_PROMOTED_BINARY: ${{ runner.temp }}/acs-release-${{ matrix.os }}-${{ matrix.arch }}/bin/acs
          ACS_PROMOTED_SANDBOX_BACKEND: ${{ matrix.sandbox_backend }}
        run: ACS_PROMOTED_VERSION="$GITHUB_REF_NAME" go test ./acceptance -count=1

      - name: Record sanitized native candidate observation
        shell: bash
        run: |
          {
            printf '%s\n' '## Native candidate gate'
            printf '%s\n' ''
            printf '%s\n' "- Target: \`${{ matrix.target }}\` on its required native runner."
            printf '%s\n' "- Backend observation: required native backend is \`${{ matrix.sandbox_backend }}\`."
            printf '%s\n' '- Candidate observation: the installed black-box containment and lifecycle suite passed.'
            printf '%s\n' '- Compatibility rule: macOS uses the verified system Seatbelt backend; Ubuntu uses the verified signed-system Bubblewrap package and targeted AppArmor profile.'
            printf '%s\n' '- The candidate itself is never rebuilt in this job.'
            printf '%s\n' '- No credentials, account data, target output, Session contents, private paths, generated policy, environment values, or control characters are recorded.'
          } >>"$GITHUB_STEP_SUMMARY"

  attest:
    name: Attest exact release bytes
    needs:
      - candidate
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download native-validated candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Release candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify candidate identity before attestation
        run: go run ./tools/releaseverify --dist dist/release-candidate --version "$GITHUB_REF_NAME"

      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release-candidate/*.tar.gz
            dist/release-candidate/SHA256SUMS

  publish:
    name: Stage and publish immutable Release
    needs:
      - candidate
      - native
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download attested candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate

      - name: Restore installer mode normalized by artifact transport
        shell: bash
        run: |
          installer=dist/release-candidate/install.sh
          if [[ ! -f "$installer" || -L "$installer" ]]; then
            echo "Release candidate install.sh is missing or unsafe."
            exit 1
          fi
          chmod 0755 "$installer"

      - name: Verify candidate identity before publication
        run: go run ./tools/releaseverify --dist dist/release-candidate --version "$GITHUB_REF_NAME"

      - name: Verify the authorized human actor before credentials
        shell: bash
        env:
          AUTHORIZED_ACTOR_ID: ${{ vars.ACS_RELEASE_TAG_CREATOR_ID }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [[ ! "$AUTHORIZED_ACTOR_ID" =~ ^[1-9][0-9]*$ || "$EVENT_ACTOR_ID" != "$AUTHORIZED_ACTOR_ID" ]]; then
            echo "The tag-triggering actor is not the authorized release maintainer."
            exit 1
          fi

      - name: Create the isolated policy-verification token
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ACS_RELEASE_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACS_RELEASE_POLICY_APP_PRIVATE_KEY }}
          # GitHub omits ruleset bypass actors without Administration(write).
          permission-administration: write

      - name: Stage exact assets and publish once
        env:
          ACS_RELEASE_TAG_RULESET_ID: ${{ vars.ACS_RELEASE_TAG_RULESET_ID }}
          ACS_RELEASE_TAG_CREATION_RULESET_ID: ${{ vars.ACS_RELEASE_TAG_CREATION_RULESET_ID }}
          ACS_RELEASE_TAG_CREATOR_ID: ${{ vars.ACS_RELEASE_TAG_CREATOR_ID }}
          ACS_RELEASE_ACTOR_ID: ${{ github.actor_id }}
          ACS_RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/publish-release.sh \
            "$GITHUB_REF_NAME" \
            "${{ needs.candidate.outputs.source-commit }}" \
            "${{ needs.candidate.outputs.tag-object }}" \
            dist/release-candidate \
            "docs/releases/$GITHUB_REF_NAME.md"
