name: Stage Linux candidate (no publication)

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packaging:
    name: Native Linux amd64 packaging (admission disabled)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download exact staged Linux candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/linux-candidate
      - name: Restore transported installer mode
        run: |
          test -f dist/linux-candidate/install.sh
          test ! -L dist/linux-candidate/install.sh
          chmod 0755 dist/linux-candidate/install.sh
      - name: Validate exact bytes, local install and update, and disabled admission
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          scripts/validate-promoted-artifact.sh "$CANDIDATE_VERSION" linux amd64 \
            dist/linux-candidate "${RUNNER_TEMP}/acs-linux-candidate/bin"
      - name: Scan exact installed Linux candidate
        run: scripts/check-go-vulnerabilities.sh binary "${RUNNER_TEMP}/acs-linux-candidate/bin/acs"
      - name: Recheck candidate identity before attestation
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: go run ./tools/releaseverify --dist dist/linux-candidate --version "$CANDIDATE_VERSION" --linux-candidate
      # PRs have packaging evidence only; trusted pushes also attest the staged
      # archive and manifest. The installer remains byte-validated, not attested.
      - name: Attest staged Linux archive and manifest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/linux-candidate/*.tar.gz
            dist/linux-candidate/SHA256SUMS
