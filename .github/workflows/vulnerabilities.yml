name: Go vulnerabilities

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Recheck main for newly disclosed vulnerabilities even without code changes.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnerabilities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (darwin/arm64)
    # The scanner is built for the host while the source scan always targets
    # GOOS=darwin GOARCH=arm64 CGO_ENABLED=0, so a Linux runner reports the
    # same findings without occupying a macOS runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan supported release target
        run: scripts/check-go-vulnerabilities.sh source
