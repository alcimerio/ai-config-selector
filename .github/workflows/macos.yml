name: macOS validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  seatbelt-zombie-stress:
    name: Seatbelt zombie settlement (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
          - target: darwin/amd64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Stress zombie settlement
        run: |
          status=0
          for shard in 1 2 3 4; do
            go test -count=50 ./internal/launch \
              -run '^TestSeatbeltConvergesAcrossForkingAndZombieDescendants/zombie-parent$' &
          done
          for pid in $(jobs -p); do
            wait "$pid" || status=1
          done
          exit "$status"

  verify:
    name: Verify (macOS)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Build
        run: go build -o /tmp/acs ./cmd/acs

      - name: Build and verify Release candidate
        run: scripts/release-candidate.sh v0.3.2
