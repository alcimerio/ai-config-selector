name: macOS validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  enumerate-packages:
    name: Enumerate native Go packages
    runs-on: macos-26
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Enumerate exact package set
        id: packages
        shell: bash
        run: |
          packages="$(go list -json ./... | jq --slurp --compact-output 'map(.ImportPath)')"
          if [[ "$(jq 'length' <<<"$packages")" -eq 0 ]]; then
            echo "Native package discovery returned no packages." >&2
            exit 1
          fi
          printf 'packages=%s\n' "$packages" >>"$GITHUB_OUTPUT"

  package-tests:
    name: Test native package (${{ matrix.package }})
    needs: enumerate-packages
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.enumerate-packages.outputs.packages) }}
    runs-on: macos-26
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test package
        env:
          ACS_TEST_PACKAGE: ${{ matrix.package }}
        run: |
          printf 'Testing package %s\n' "$ACS_TEST_PACKAGE"
          go test -count=1 -v -timeout=6m "$ACS_TEST_PACKAGE"

  launch-handshake-diagnostics:
    name: Diagnose native launch (${{ matrix.test }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test:
          - TestSeatbeltSupervisorStartHandshake
          - TestSeatbeltSupervisorEnvironmentHandshakeAndBoundedStall
          - TestSeatbeltSupervisorCancellationUnblocksStartupAndPreservesPostStartSignal
          - TestSelectedEnvironmentPolicyValidationStage
          - TestSelectedEnvironmentSupervisorStartAndCancelStage
          - TestSelectedEnvironmentStaysSeparateFromPolicyValidationAndStatusProxy
    runs-on: macos-26
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: List and run exact launch test
        env:
          ACS_LAUNCH_TEST: ${{ matrix.test }}
        run: |
          printf 'Selected launch test: %s\n' "$ACS_LAUNCH_TEST"
          listed="$(go test -list "^${ACS_LAUNCH_TEST}$" ./internal/launch)"
          printf '%s\n' "$listed"
          if ! grep -Fqx -- "$ACS_LAUNCH_TEST" <<<"$listed"; then
            echo "Selected launch test was not discovered." >&2
            exit 1
          fi
          go test -count=1 -v -timeout=2m ./internal/launch -run "^${ACS_LAUNCH_TEST}$"

  seatbelt-zombie-stress:
    name: Seatbelt zombie settlement (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Stress zombie settlement
        run: |
          status=0
          pids=()
          for shard in 1 2 3 4; do
            go test -count=50 ./internal/launch \
              -run '^TestSeatbeltConvergesAcrossForkingAndZombieDescendants/zombie-parent$' &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

  verify:
    name: Verify (macOS)
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Build
        run: go build -o /tmp/acs ./cmd/acs

      - name: Build and verify Release candidate
        run: scripts/release-candidate.sh v0.4.0
