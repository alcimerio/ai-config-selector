name: macOS validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  seatbelt-zombie-stress:
    name: Seatbelt zombie settlement (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Stress zombie settlement
        run: |
          status=0
          pids=()
          for shard in 1 2 3 4; do
            go test -count=50 ./internal/launch \
              -run '^TestSeatbeltConvergesAcrossForkingAndZombieDescendants/zombie-parent$' &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

  verify:
    name: Verify (macOS)
    runs-on: macos-26
    # Allow headroom for serial normal/race/stress suites, setup, and
    # candidate builds. Preserve the per-package Go test deadlines
    # below so a hung package still fails promptly.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Test terminal isolation
        run: >-
          go test -v -timeout=90s ./internal/launch
          -run '^TestSeatbelt(Policy.*Terminal.*|Terminal.*|NativeRestrictsTerminalAccessToInheritedPTYs|NativeRetainsControllingTTYWithRedirectedStdio|PreservesRawTerminalDescriptors|PreservesTerminalResize|NativeRoutesTerminalSignalsOnlyToContainedTarget)$'

      - name: Test
        run: go test -v -timeout=5m ./...

      - name: Race test
        run: go test -race -timeout=10m ./...

      - name: Stress Profile Builder panic restoration
        run: >-
          go test -race ./internal/builder
          -run '^TestProfileBuilderPTYRestoresTerminal/recovered_panic$'
          -count=20 -timeout=2m

      - name: Build
        run: go build -o /tmp/acs ./cmd/acs

      - name: Build and verify Release candidate
        run: scripts/release-candidate.sh v0.5.1
