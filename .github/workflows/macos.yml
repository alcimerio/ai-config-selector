name: macOS validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# Superseded pull request commits stop occupying macOS runners. Every main and
# tag commit still completes its own validation.
concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seatbelt-zombie-stress:
    name: Seatbelt zombie settlement (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go-macos

      - name: Stress zombie settlement
        run: |
          status=0
          pids=()
          for shard in 1 2 3 4; do
            go test -count=50 ./internal/launch \
              -run '^TestSeatbeltConvergesAcrossForkingAndZombieDescendants/zombie-parent$' &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

  verify-unit:
    name: Verify unit (macOS)
    runs-on: macos-26
    # The normal suite runs in parallel with verify-race. Preserve the
    # per-package Go test deadline below so a hung package still fails promptly.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go-macos
        with:
          cache-family: unit

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Test terminal isolation
        run: >-
          go test -v -timeout=90s ./internal/launch
          -run '^TestSeatbelt(Policy.*Terminal.*|Terminal.*|NativeRestrictsTerminalAccessToInheritedPTYs|NativeRetainsControllingTTYWithRedirectedStdio|PreservesRawTerminalDescriptors|PreservesTerminalResize|NativeRoutesTerminalSignalsOnlyToContainedTarget)$'

      - name: Test sandbox denials
        run: >-
          go test -v -timeout=3m ./internal/launch
          -run '^TestSeatbelt(Verifies(HostAutomationIsDenied|InboundConnectionsAreNotAccepted)|Reports(DetachedDescendantAfterSupervisorLoss|TerminalInputQueueAfterTargetExit|AbsentExclusionSpellingVariants))$'

      - name: Test
        run: go test -v -timeout=5m ./...

      - name: Build
        run: go build -o /tmp/acs ./cmd/acs

      - name: Build and verify Release candidate
        run: scripts/release-candidate.sh v0.5.1

      # The only writer of the unit cache family: one complete save per main commit.
      - name: Save Go build and module caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.cache-key }}

  verify-race:
    name: Verify race (macOS)
    runs-on: macos-26
    # Preserve the per-package Go test deadlines below so a hung package
    # still fails promptly.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go-macos
        with:
          cache-family: race

      - name: Race test
        run: go test -race -timeout=10m ./...

      - name: Stress Profile Builder panic restoration
        run: >-
          go test -race ./internal/builder
          -run '^TestProfileBuilderPTYRestoresTerminal/recovered_panic$'
          -count=20 -timeout=2m

      # The only writer of the race cache family: one complete save per main commit.
      - name: Save Go build and module caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.cache-key }}

  verify:
    name: Verify (macOS)
    needs: [verify-unit, verify-race]
    # Keep the required context stable while the normal and race suites run
    # in parallel. Inspect unsuccessful dependencies instead of skipping this
    # required check.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require the normal and race suites to succeed
        env:
          UNIT_RESULT: ${{ needs.verify-unit.result }}
          RACE_RESULT: ${{ needs.verify-race.result }}
        shell: bash
        run: |
          if [[ "$UNIT_RESULT" != "success" || "$RACE_RESULT" != "success" ]]; then
            printf 'Required macOS verification failed: unit=%s race=%s\n' "$UNIT_RESULT" "$RACE_RESULT"
            exit 1
          fi
