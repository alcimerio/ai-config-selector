name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-portability:
    name: Observe Linux portability (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile portable tests without running Linux-native behavior
        run: go test -run '^$' ./...

      - name: Compile the retained Linux command
        run: CGO_ENABLED=0 go build -o /tmp/acs-linux ./cmd/acs
