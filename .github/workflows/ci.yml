name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-linux:
    name: Portable Linux tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet for linux/amd64 and darwin/arm64
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go vet ./...

      - name: Build the command for linux/amd64 and linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/acs-linux-amd64 ./cmd/acs
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/acs-linux-arm64 ./cmd/acs

      - name: Run portable tests
        run: CGO_ENABLED=0 go test ./...

      - name: Linux launch fails closed without a backend
        run: |
          home="$(mktemp -d)"
          set +e
          output="$(HOME="$home" /tmp/acs-linux-amd64 devin --profile linux-ci-probe 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s' "$output" | grep -q 'Linux sandbox backend is not available yet'
          printf '%s' "$output" | grep -q 'never runs targets unsandboxed'
