name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-compilation:
    name: Compile portable source (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile portable tests without executing them
        run: |
          compile_dir="$(mktemp -d)"
          trap 'rm -rf "$compile_dir"' EXIT
          CGO_ENABLED=0 go test -c -o "$compile_dir/" ./...

      - name: Compile the command without a runtime backend
        run: CGO_ENABLED=0 go build -o /tmp/acs-portable ./cmd/acs
