name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Ubuntu Bubblewrap
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor apparmor-utils bubblewrap
          profile_source="$(mktemp)"
          verify_stdout="$(mktemp)"
          verify_stderr="$(mktemp)"
          trap 'rm -f "$profile_source" "$verify_stdout" "$verify_stderr"' EXIT
          curl --fail --location --silent --show-error --output "$profile_source" \
            https://gitlab.com/apparmor/apparmor/-/raw/v4.0.3/profiles/apparmor/profiles/extras/bwrap-userns-restrict
          echo 'a964037f6cf0df1099f14226b037eaedde6237c86e715188e93eb460b30be859  '"$profile_source" | sha256sum --check --status
          sudo install --owner=root --group=root --mode=0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/sbin/apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/sbin/aa-status --enabled
          [[ -f /usr/bin/bwrap && ! -L /usr/bin/bwrap && -x /usr/bin/bwrap ]]
          [[ "$(stat --format='%u:%a' /usr/bin/bwrap)" == "0:755" ]]
          [[ "$(env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg-query --search /usr/bin/bwrap)" == "bubblewrap: /usr/bin/bwrap" ]]
          package_record="$(env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg-query --show --showformat='${db:Status-Abbrev}\n${binary:Package}\n${source:Package}\n${Architecture}\n' bubblewrap)"
          [[ "$package_record" == $'ii \nbubblewrap\nbubblewrap\namd64' ]]
          env -i LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/dpkg --verify --verify-format=rpm bubblewrap >"$verify_stdout" 2>"$verify_stderr"
          [[ ! -s "$verify_stdout" && ! -s "$verify_stderr" ]]
          /usr/bin/bwrap \
            --unshare-user --unshare-ipc --unshare-pid --unshare-uts --unshare-cgroup \
            --die-with-parent --clearenv --proc /proc --dev /dev \
            --dir /tmp \
            --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --ro-bind /usr /usr --remount-ro / \
            --setenv PATH /usr/bin:/bin --chdir /tmp -- /usr/bin/true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Test
        run: go test ./...

      - name: Race test
        # The Linux cancelreader used by Bubble Tea races with its own shutdown
        # when an abrupt runtime-error or recovered-panic PTY subprocess is
        # race-instrumented. The normal Test step still runs both native
        # terminal-restoration cases.
        run: go test -race ./... -skip '^TestProfileBuilderPTYRestoresTerminal/(runtime_error|recovered_panic)$'

      - name: Build
        run: go build -o /tmp/acs ./cmd/acs

      - name: Build and verify Release candidate
        run: scripts/release-candidate.sh v0.3.1
